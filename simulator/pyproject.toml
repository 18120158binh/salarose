[project]
name = "cdp-sim"
version = "0.1.0"
description = "Traffic simulator for the journey engine: smoke, logical, and clean-up runs against a deployment."
requires-python = ">=3.11"
dependencies = [
  "kafka-python==2.3.3",
  "boto3==1.43.126",
  "pg8000==1.31.6",
  "requests==2.32.5",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "trustme==1.2.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cdp_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
