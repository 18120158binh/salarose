apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cdp
resources:
  # Generates the ConfigMap db-migrations from infra/db/migrations.
  - ../../db
  # Generates the ConfigMap import-store-ddl from infra/db/import-store.
  - ../../db/import-store
  - db-migrate.yaml
  - postgres-monitoring.yaml
  - postgres.yaml
  - import-store.yaml
  - import-store-ddl.yaml
  - kafka.yaml
  - topics.yaml
