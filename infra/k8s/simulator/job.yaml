# One traffic simulator run on the aws-free-plan cluster (docs/internal/features/traffic-simulator.md).
# No kustomization lists this file, so Argo CD never applies it and a sync starts no run (SIM-FR-06).
# An engineer starts each run with an explicit command, from a checkout on platform-1 (simulator/README.md):
#   tag=$(cat infra/k8s/simulator/image-tag)
#   ip=$(sed -n 's/^IP_DASHED=//p' infra/k8s/envs/aws-free-plan/env.properties)
#   sed -e "s/SIM_TAG/$tag/" -e "s/SIM_IP_DASHED/$ip/" -e 's/SIM_ARGS/"smoke"/' infra/k8s/simulator/job.yaml | k3s kubectl create -f -
# SIM_ARGS is "smoke", "logical", or "cleanup", "--run", "<run id>" with "--fixtures" and "--apply" as wanted.
# The build-simulator workflow pushes cdp/simulator:sha-<12 chars> and then records that tag in image-tag, next to
# this file. The tag is the simulator's own, not the overlay's.
# Postgres credentials come from the CloudNativePG app secret, and the studio service account from Secrets Manager
# with the node role. Neither is printed.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sim-run-
  namespace: cdp
  labels:
    app.kubernetes.io/name: traffic-simulator
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-simulator
    spec:
      restartPolicy: Never
      nodeSelector:
        cdp.io/pool: compute
      containers:
        - name: simulator
          image: 582577265946.dkr.ecr.us-east-1.amazonaws.com/cdp/simulator:SIM_TAG
          args: [SIM_ARGS]
          env:
            - name: SIM_COLLECTOR_URL
              value: http://collector.cdp.svc
            - name: SIM_KAFKA_BROKERS
              value: cdp-kafka-bootstrap.cdp.svc:9092
            - name: SIM_REPORT_BUCKET
              value: cdp-free-plan-582577265946
            # Public, because studio's sign-in callback and its server actions' origin check use the public host.
            - name: SIM_STUDIO_URL
              value: https://studio.SIM_IP_DASHED.sslip.io
            - name: SIM_LOGIN_SECRET_ID
              value: cdp-free-plan/logins
            - name: SIM_SCENARIO_WINDOW_S
              value: "60"
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: PGHOST
              value: cdp-pg-rw.cdp.svc
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: cdp-pg-app
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: cdp-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdp-pg-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
