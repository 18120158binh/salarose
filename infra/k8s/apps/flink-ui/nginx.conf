# Each JobManager's rest Service is recreated on a savepoint upgrade with a new ClusterIP, so resolve it per request.
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;

    # AFP-FR-25: the Flink REST API cancels, stops, rescales, and submits jobs only through non-GET methods.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Flink 2.2 still routes GET /jobs/<id>/yarn-cancel and yarn-stop, unversioned and under /v1, to job termination,
    # and web.cancel.enable does not gate them. $uri is already decoded and normalized when this matches.
    location ~* /yarn- {
        return 403;
    }

    location = / {
        root /etc/nginx/conf.d;
        try_files /index.html =404;
    }

    location ~ ^/(campaign-outbox-job|campaign-state-machine-job|customer-decision-job|customer-profile-writer-job|event-parse-job)$ {
        return 301 /$1/;
    }

    location ~ ^/(campaign-outbox-job|campaign-state-machine-job|customer-decision-job|customer-profile-writer-job|event-parse-job)/ {
        set $job $1;
        rewrite ^/[^/]+(/.*)$ $1 break;
        proxy_pass http://$job-rest.cdp.svc.cluster.local:8081;
    }

    location / {
        return 404;
    }
}
