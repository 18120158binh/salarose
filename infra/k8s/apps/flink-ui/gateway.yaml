# Serves the landing page and routes /<job name>/ to that job's REST port, GET and HEAD only (AFP-FR-23, AFP-FR-25).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-ui-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flink-ui-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink-ui-gateway
    spec:
      nodeSelector:
        cdp.io/pool: platform
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: flink-ui-gateway
            items:
              - key: nginx.conf
                path: default.conf
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: flink-ui-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  selector:
    app.kubernetes.io/name: flink-ui-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
