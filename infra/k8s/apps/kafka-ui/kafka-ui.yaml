# The read-only Kafka browser (AFP-FR-30). The bootstrap script creates the secret kafka-ui-oidc from the kafka-ui
# app client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      nodeSelector:
        cdp.io/pool: compute
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_CONFIG_ADDITIONAL-LOCATION
              value: /config/config.yml
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=60
            - name: AUTH_OAUTH2_CLIENT_COGNITO_ISSUERURI
              value: https://cognito-idp.us-east-1.amazonaws.com/COGNITO_POOL_ID
            - name: AUTH_OAUTH2_CLIENT_COGNITO_REDIRECTURI
              value: https://kafka.IP_DASHED.sslip.io/login/oauth2/code/cognito
            - name: AUTH_OAUTH2_CLIENT_COGNITO_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-oidc
                  key: client-id
            - name: AUTH_OAUTH2_CLIENT_COGNITO_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-oidc
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: kafka-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  annotations:
    argocd.argoproj.io/sync-wave: "24"
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kafka.IP_DASHED.sslip.io
      secretName: kafka-ui-tls
  rules:
    - host: kafka.IP_DASHED.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  name: http
