# Applied to every FlinkDeployment through the flink-common component. Each job file adds its name,
# entry class, sync wave, and the S3 paths that carry its name.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: all-jobs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: cdp/flink-jobs:IMAGE_TAG
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  # Created with its Role in each watched namespace by the operator chart (jobServiceAccount, rbac.jobRole).
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    state.backend.type: rocksdb
    execution.checkpointing.incremental: "true"
    high-availability.type: kubernetes
    # The operator makes the CPU request equal to the limit unless these factors raise the limit.
    kubernetes.jobmanager.cpu.limit-factor: "4"
    kubernetes.taskmanager.cpu.limit-factor: "4"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
  podTemplate:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cdp.io/pool
                    operator: In
                    values: [compute, data]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: cdp.io/pool
                    operator: In
                    values: [compute]
      containers:
        - name: flink-main-container
          ports:
            - name: metrics
              containerPort: 9249
          env:
            # S3 credentials come from the node's instance role: the S3A default chain ends in
            # IAMInstanceCredentialsProvider, and IMDSv2 hop limit 2 lets pods reach it.
            - name: ENABLE_BUILT_IN_PLUGINS
              value: flink-s3-fs-hadoop-2.2.0.jar
            - name: DB_HOST
              value: cdp-pg-rw.cdp.svc
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: auroracy
            - name: DB_USER
              value: cdp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdp-pg-app
                  key: password
            - name: KAFKA_BROKERS
              value: cdp-kafka-bootstrap.cdp.svc:9092
  jobManager:
    replicas: 1
    resource:
      memory: 1024m
      cpu: 0.25
  taskManager:
    resource:
      memory: 2048m
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/usrlib/event-processor.jar
    parallelism: 1
    upgradeMode: savepoint
    state: running
