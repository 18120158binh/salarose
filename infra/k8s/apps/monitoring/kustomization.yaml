apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cdp
resources:
  - flink-podmonitor.yaml
  - postgres-podmonitor.yaml
  - pipeline-alerts.yaml
  - ../../../monitoring
# Grafana's dashboard sidecar loads every ConfigMap labeled grafana_dashboard=1 in any namespace (AFP-FR-26).
configMapGenerator:
  - name: flink-jobs-dashboard
    files:
      - dashboards/flink-jobs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
patches:
  - target:
      kind: PrometheusRule
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "20"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
