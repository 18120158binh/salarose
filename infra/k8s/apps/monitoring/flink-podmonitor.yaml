apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flink
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      type: flink-native-kubernetes
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
