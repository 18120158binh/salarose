apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cdp-pg
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cdp-pg
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
