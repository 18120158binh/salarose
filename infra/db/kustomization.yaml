# Kustomize reads only files under its own root, so the migrations ConfigMap is generated here. List every file in
# migrations/; test-migrations.sh fails when one is missing. The name hash changes with the content.
configMapGenerator:
  - name: db-migrations
    files:
      - flyway.toml
      - migrations/V0001__baseline.sql
      - migrations/V0002__journey_drafts_and_preview.sql
      - migrations/V0003__event_volume_and_metric_creator.sql
      - migrations/V0004__data_import_tables.sql
      - migrations/V0006__segment_members.sql
      - migrations/beforeMigrate.sql
