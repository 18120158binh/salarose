global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics

  - job_name: "flink-jobmanager"
    static_configs:
      - targets: ["flink-jobmanager:9249"]
    metrics_path: /

  - job_name: "flink-taskmanager"
    static_configs:
      - targets: ["flink-taskmanager:9249"]
    metrics_path: /
